[package]
name = "ghostchat"
version = "0.1.0"
edition = "2021"
description = "An ephemeral, anonymous 3-person group chat application."

[dependencies]
# Exact pin to openmls 0.9.0 as per architecture decision
openmls = "=0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_basic_credential = "0.6.0"
zeroize = "1.8.1"
log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true