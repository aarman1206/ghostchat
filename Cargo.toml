[workspace]
members = [".", "app/src-tauri"]
resolver = "2"

[package]
name = "ghostchat"
version = "0.1.0"
edition = "2021"
description = "Ephemeral three-person OpenMLS chat over Tor onion services."

[dependencies]
# Exact pin to openmls 0.9.0 as per architecture decision
openmls = "=0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
zeroize = "1.8.1"
thiserror = "1.0"
rand = "0.8"
ed25519-dalek = "2.1"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
subtle = "2.6"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
